name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
            targets: MB11_AU MB11_VST3 MB11_CLAP MB11_Standalone MB11Tests
            tests: build/MB11Tests_artefacts/Release/MB11Tests
          - name: Linux
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
            targets: MB11_VST3 MB11_CLAP MB11_Standalone MB11Tests
            tests: build/MB11Tests_artefacts/Release/MB11Tests
          - name: Windows
            os: windows-latest
            configure: -A x64
            targets: MB11_VST3 MB11_CLAP MB11_Standalone MB11Tests
            tests: build/MB11Tests_artefacts/Release/MB11Tests.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for credentials and local-machine data
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "${GITHUB_EVENT_BEFORE:-}" && "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            ./tools/check-sensitive-data.sh "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA"
          else
            ./tools/check-sensitive-data.sh
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev libegl-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }} -DMB11_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel --target ${{ matrix.targets }}

      - name: Test
        shell: bash
        run: ${{ matrix.tests }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp docs/Schnellstart.md dist/
          cd build/MB11_artefacts/Release
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --keepParent AU/MB-11.component "$GITHUB_WORKSPACE/dist/MB-11-macOS-AU.zip"
              ditto -c -k --keepParent VST3/MB-11.vst3 "$GITHUB_WORKSPACE/dist/MB-11-macOS-VST3.zip"
              ditto -c -k --keepParent CLAP/MB-11.clap "$GITHUB_WORKSPACE/dist/MB-11-macOS-CLAP.zip"
              ditto -c -k --keepParent Standalone/MB-11.app "$GITHUB_WORKSPACE/dist/MB-11-macOS-Standalone.zip" ;;
            Linux)
              tar -czf "$GITHUB_WORKSPACE/dist/MB-11-Linux-VST3.tar.gz" -C VST3 MB-11.vst3
              tar -czf "$GITHUB_WORKSPACE/dist/MB-11-Linux-CLAP.tar.gz" -C CLAP MB-11.clap
              tar -czf "$GITHUB_WORKSPACE/dist/MB-11-Linux-Standalone.tar.gz" -C Standalone MB-11 ;;
            Windows)
              7z a "$GITHUB_WORKSPACE/dist/MB-11-Windows-VST3.zip" ./VST3/MB-11.vst3
              7z a "$GITHUB_WORKSPACE/dist/MB-11-Windows-CLAP.zip" ./CLAP/MB-11.clap
              7z a "$GITHUB_WORKSPACE/dist/MB-11-Windows-Standalone.zip" ./Standalone/MB-11.exe ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: MB-11-${{ matrix.name }}
          path: dist/*
          retention-days: 30

  # A version tag (v1.2.3) publishes all packages as a GitHub release.
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p release
          find artifacts -type f ! -name Schnellstart.md -exec cp {} release/ \;
          cp "$(find artifacts -name Schnellstart.md | head -n 1)" release/MB-11-Schnellstart.md
          ls -l release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MB-11 ${GITHUB_REF_NAME#v}" \
            --generate-notes
