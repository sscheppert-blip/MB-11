name: build

# Builds run only on demand, to save Actions minutes (macOS counts 10x, Windows 2x):
#   GitHub → Actions → build → "Run workflow", or:  gh workflow run build -f version=0.2.0
# The version must match VERSION in CMakeLists.txt. Each run builds and tests AU, VST3 and CLAP
# and publishes them as release v<version>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, must match VERSION in CMakeLists.txt (creates tag v<version>)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap checks first (one Linux minute), so a bad version or a leak never starts the expensive builds.
  scan:
    name: Check version and scan for sensitive data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 0.2.0" >&2; exit 1; }
          grep -Eq "^project\(MB11 VERSION ${VERSION//./\\.} " CMakeLists.txt \
            || { echo "version $VERSION does not match VERSION in CMakeLists.txt" >&2; exit 1; }

      - name: Scan for credentials and local-machine data
        run: |
          sudo apt-get install -y ripgrep
          ./tools/check-sensitive-data.sh

  build:
    name: ${{ matrix.name }}
    needs: scan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
            targets: MB11_AU MB11_VST3 MB11_CLAP MB11Tests
            tests: build/MB11Tests_artefacts/Release/MB11Tests
          - name: Linux
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
            targets: MB11_VST3 MB11_CLAP MB11Tests
            tests: build/MB11Tests_artefacts/Release/MB11Tests
          - name: Windows
            os: windows-latest
            configure: -A x64
            targets: MB11_VST3 MB11_CLAP MB11Tests
            tests: build/MB11Tests_artefacts/Release/MB11Tests.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev libegl-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }} -DMB11_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel --target ${{ matrix.targets }}

      - name: Test
        shell: bash
        run: ${{ matrix.tests }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd build/MB11_artefacts/Release
          case "${{ runner.os }}" in
            macOS)
              ditto -c -k --keepParent AU/MB-11.component "$GITHUB_WORKSPACE/dist/MB-11-macOS-AU.zip"
              ditto -c -k --keepParent VST3/MB-11.vst3 "$GITHUB_WORKSPACE/dist/MB-11-macOS-VST3.zip"
              ditto -c -k --keepParent CLAP/MB-11.clap "$GITHUB_WORKSPACE/dist/MB-11-macOS-CLAP.zip" ;;
            Linux)
              tar -czf "$GITHUB_WORKSPACE/dist/MB-11-Linux-VST3.tar.gz" -C VST3 MB-11.vst3
              tar -czf "$GITHUB_WORKSPACE/dist/MB-11-Linux-CLAP.tar.gz" -C CLAP MB-11.clap ;;
            Windows)
              7z a "$GITHUB_WORKSPACE/dist/MB-11-Windows-VST3.zip" ./VST3/MB-11.vst3
              7z a "$GITHUB_WORKSPACE/dist/MB-11-Windows-CLAP.zip" ./CLAP/MB-11.clap ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: MB-11-${{ matrix.name }}
          path: dist/*
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MB-11-*
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          ls -l release
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MB-11 $VERSION" \
            --generate-notes
